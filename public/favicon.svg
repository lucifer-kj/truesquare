<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#27272A" stroke-width="2" />

  <!-- Folded Invoice Document -->
  <path d="M42 26 H76 L94 44 V100 H42 Z" fill="#27272A" />
  <path d="M76 26 V44 H94 Z" fill="#3F3F46" />

  <!-- Carpenter's Framing Square (Safety Amber) -->
  <path d="M30 26 H42 V100 H30 Z" fill="url(#amberGrad)" />
  <path d="M30 88 H98 V100 H30 Z" fill="url(#amberGrad)" />

  <!-- Precision Measurement Ticks -->
  <line x1="30" y1="42" x2="36" y2="42" stroke="#78350F" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="58" x2="38" y2="58" stroke="#78350F" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="74" x2="36" y2="74" stroke="#78350F" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="100" x2="56" y2="94" stroke="#78350F" stroke-width="2" stroke-linecap="round" />
  <line x1="72" y1="100" x2="72" y2="92" stroke="#78350F" stroke-width="2" stroke-linecap="round" />
  <line x1="86" y1="100" x2="86" y2="94" stroke="#78350F" stroke-width="2" stroke-linecap="round" />

  <!-- Document Ledger Lines -->
  <line x1="50" y1="54" x2="82" y2="54" stroke="#71717A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="66" x2="74" y2="66" stroke="#71717A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="78" x2="80" y2="78" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />
</svg>
