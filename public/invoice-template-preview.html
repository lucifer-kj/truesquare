<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice</title>
<style>
  @page {
    size: Letter portrait;
    margin: 8mm 10mm 8mm 10mm;
    @bottom-left  { content: "Generated by BuildBill"; font: 7pt Arial, sans-serif; color: #94a3b8; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 7pt Arial, sans-serif; color: #94a3b8; }
  }
  :root {
    --ink: #111827;
    --navy: #0f2744;
    --steel: #6b7280;
    --mist: #f9fafb;
    --border: #e5e7eb;
    --rule: #d1d5db;
    --signal: #2563eb;
    --zebra: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    overflow-y: hidden;
  }
  body {
    background: #475569;
    font: 8.5pt/1.4 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    display: flex;
    justify-content: center;
    padding: 0;
    overflow-x: hidden;
  }

  /* Sheet container - Fixed Letter height with flex column layout */
  .page {
    background: #ffffff;
    width: 8.5in;
    height: 11in;
    min-height: 11in;
    max-height: 11in;
    margin: 0 auto;
    padding: 0.45in 0.55in;
    box-shadow: 0 4px 25px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
  }

  .mono { font-family: "Courier New", Courier, monospace; }
  .r { text-align: right; }
  .c { text-align: center; }
  [hidden] { display: none !important; }

  /* Header: Company info (left) & Invoice identity (right) */
  .head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    border-top: 3px solid var(--navy);
    padding-top: 14px;
    margin-bottom: 16px;
    flex-shrink: 0;
  }
  .head > div { min-width: 0; }
  .co-name {
    font-size: 14pt;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.2;
    margin-bottom: 4px;
    color: var(--navy);
  }
  .co-addr {
    font-size: 7.5pt;
    color: var(--steel);
    line-height: 1.5;
  }
  .doc-meta-block {
    text-align: right;
    flex-shrink: 0;
  }
  .title {
    font-size: 20pt;
    font-weight: 800;
    letter-spacing: 1.5px;
    line-height: 1.05;
    color: var(--navy);
    text-transform: uppercase;
  }
  .docno {
    font-size: 9.5pt;
    font-weight: 600;
    color: var(--steel);
    margin-top: 3px;
    margin-bottom: 8px;
  }
  .header-dates-table {
    margin-left: auto;
    border-collapse: collapse;
    font-size: 8pt;
  }
  .header-dates-table td {
    padding: 2px 0;
  }
  .header-dates-table td.date-lbl {
    color: var(--steel);
    font-weight: 600;
    padding-right: 10px;
    text-align: right;
    white-space: nowrap;
  }
  .header-dates-table td.date-val {
    color: var(--ink);
    font-weight: 700;
    text-align: right;
    white-space: nowrap;
    font-family: "Courier New", Courier, monospace;
    font-size: 8.5pt;
  }

  /* 2-Column Info Ribbon: Bill To / Ship To (left block), Order Particulars (right) */
  .info-columns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    background: var(--mist);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 7.5pt;
    line-height: 1.45;
    flex-shrink: 0;
  }
  .info-columns > div { min-width: 0; }
  .info-columns h3 {
    font-size: 6.5pt;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
  }
  .nm { font-weight: 700; color: var(--ink); font-size: 8.5pt; }
  .kv {
    width: 100%;
    border-collapse: collapse;
    font-size: 7.5pt;
  }
  .kv td { padding: 1.5px 0; }
  .kv td:first-child { color: var(--steel); width: 42%; font-size: 7pt; }
  .kv td:last-child { text-align: right; font-weight: 600; color: var(--ink); word-break: break-word; }

  /* Middle Block: Items Table & Totals Row */
  .items-and-totals-block {
    flex-shrink: 0;
  }

  table.items {
    width: 100%;
    border-collapse: collapse;
    font-size: 8pt;
    table-layout: fixed;
  }
  .items thead { display: table-header-group; }
  .items th {
    font-size: 6.5pt;
    font-weight: 700;
    color: #ffffff;
    background: var(--navy);
    padding: 6px 8px;
    border-bottom: none;
    text-align: center;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .items th:first-child { border-radius: 2px 0 0 0; }
  .items th:last-child { border-radius: 0 2px 0 0; }
  .items th:nth-child(2) { text-align: left; }
  .items th:nth-child(5), .items th:nth-child(6) { text-align: right; }
  .items td {
    padding: 6px 8px;
    vertical-align: middle;
    border-bottom: 1px solid var(--border);
    color: var(--ink);
  }
  .items tr { break-inside: avoid; }
  .items tbody tr:nth-child(even) { background: var(--zebra); }
  .items td.c:first-child { color: var(--steel); font-weight: 600; font-size: 7.5pt; }
  .items .item-title {
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
    font-size: 8pt;
  }
  .items .sp {
    font-size: 7pt;
    color: var(--steel);
    margin-top: 1px;
    line-height: 1.2;
  }
  .items .sku {
    font: 7pt "Courier New", monospace;
    color: var(--steel);
  }
  .items td:last-child {
    font-weight: 700;
    color: var(--ink);
    font-family: "Courier New", Courier, monospace;
  }
  .items tbody tr:last-child td {
    border-bottom: 2px solid var(--navy);
  }

  /* Totals Section directly beneath items */
  .totals-row-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    margin-top: 10px;
  }

  .words {
    font-size: 7.5pt;
    color: var(--steel);
    flex: 1;
    padding-top: 4px;
    overflow-wrap: break-word;
    line-height: 1.4;
  }
  .words i {
    color: var(--ink);
    margin-left: 4px;
    font-style: italic;
    font-weight: 600;
  }

  .totals-table-box {
    width: 230px;
    flex-shrink: 0;
  }
  .tot {
    width: 100%;
    border-collapse: collapse;
    font-size: 8pt;
  }
  .tot td {
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
  }
  .tot td:first-child {
    font-size: 7.5pt;
    color: var(--steel);
  }
  .tot td:last-child {
    text-align: right;
    font-weight: 600;
    white-space: nowrap;
    padding-left: 12px;
    font-family: "Courier New", Courier, monospace;
    color: var(--ink);
  }
  .tot .grand td {
    background: var(--navy);
    color: #ffffff;
    border: 0;
    padding: 7px 10px;
    font-size: 11pt;
    font-weight: 800;
    border-radius: 2px;
  }
  .tot .grand td:first-child {
    font-size: 7.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #ffffff;
  }
  .tot .sm td {
    border: 0;
    font-size: 7pt;
    color: var(--steel);
    padding-top: 2px;
  }

  /* Supplier warranty notice beneath totals */
  .warranty-notice {
    font-size: 7pt;
    color: var(--steel);
    margin-top: 8px;
    font-style: italic;
    line-height: 1.35;
  }

  /* Bottom Pinned Footer: Terms & Remittance (left) and Signatures (right) */
  .footer-pinned-block {
    margin-top: auto; /* Pushes terms and signatures down to stick to bottom */
    padding-top: 12px;
    border-top: 1.5px solid var(--rule);
    flex-shrink: 0;
  }

  .footer-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 28px;
    align-items: end;
  }
  .footer-grid > div { min-width: 0; }

  .bottom-box-title {
    font-size: 6.5pt;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
    padding-bottom: 2px;
  }

  #terms {
    padding-left: 13px;
    font-size: 7pt;
    line-height: 1.45;
    color: var(--steel);
    margin-bottom: 8px;
  }
  #terms li {
    margin-bottom: 1.5px;
  }

  .remit {
    background: var(--mist);
    border: 1px solid var(--border);
    padding: 5px 9px;
    font-size: 7pt;
    line-height: 1.4;
    border-radius: 2px;
    color: var(--steel);
  }

  .cert {
    font-size: 7pt;
    color: var(--steel);
    font-style: italic;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .sigs {
    display: grid;
    grid-template-columns: 1fr 110px;
    gap: 20px;
    align-items: flex-end;
  }
  .sig .ln {
    border-bottom: 1px solid var(--rule);
    height: 26px;
    display: flex;
    align-items: flex-end;
    padding-bottom: 2px;
    font-size: 8.5pt;
    font-weight: 600;
    color: var(--ink);
  }
  .sig .ln img { max-height: 24px; }
  .sig .cap {
    font-size: 6.5pt;
    color: var(--steel);
    margin-top: 3px;
    line-height: 1.3;
  }
  .sig .cap b { color: var(--ink); font-size: 7pt; }

  /* Single-Page Print Optimization */
  @media print {
    @page {
      size: Letter portrait;
      margin: 8mm 10mm 8mm 10mm;
    }
    html, body {
      background: none !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    .page {
      width: 100% !important;
      max-width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
      max-height: 100% !important;
      margin: 0 !important;
      padding: 0.35in 0.45in !important;
      box-shadow: none !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      box-sizing: border-box !important;
    }
    .footer-pinned-block {
      margin-top: auto !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
  }
</style>
</head>

<div class="page" id="page">
  <!-- Top: Header (Company Left, Identity & Dates Right) -->
  <header class="head">
    <div>
      <div class="co-name" data-b="seller.name"></div>
      <div class="co-addr" id="coAddr"></div>
    </div>
    <div class="doc-meta-block">
      <div class="title" id="title"></div>
      <div class="docno mono" id="docNo"></div>
      <table class="header-dates-table">
        <tr>
          <td class="date-lbl">Issue Date:</td>
          <td class="date-val" id="issueDateVal"></td>
        </tr>
        <tr>
          <td class="date-lbl" id="termDateLbl">Due Date:</td>
          <td class="date-val" id="termDateVal"></td>
        </tr>
      </table>
    </div>
  </header>

  <!-- 3-Column Info Ribbon: Bill To, Ship To, Order Particulars -->
  <section class="info-columns">
    <div>
      <h3>Bill To</h3>
      <div id="billTo"></div>
    </div>
    <div>
      <h3>Ship To</h3>
      <div id="shipTo"></div>
    </div>
    <div>
      <h3>Order Particulars</h3>
      <table class="kv" id="orderKv"></table>
    </div>
  </section>

  <!-- Middle: Line Items Table & Financial Totals Directly After It -->
  <div class="items-and-totals-block">
    <table class="items">
      <thead><tr>
        <th style="width:5%">No.</th>
        <th style="text-align:left">Description</th>
        <th style="width:8%">UOM</th>
        <th style="width:8%">Qty</th>
        <th style="width:13%">Unit Price</th>
        <th style="width:15%">Amount</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>

    <!-- Totals Summary Row: Words on left, Totals table on right -->
    <div class="totals-row-wrapper">
      <div class="words">Total in words:<i id="words"></i></div>
      <div class="totals-table-box">
        <table class="tot" id="totals"></table>
      </div>
    </div>
  </div>

  <!-- Note (if present) -->
  <div class="note" id="notes" hidden></div>

  <!-- Bottom: Pinned Footer with Terms, Remittance & Signatures (Sticks to Bottom) -->
  <footer class="footer-pinned-block">
    <div class="warranty-notice" id="warrantyNotice">All supplies are subject to standard contractor warranty and verified supplier terms.</div>
    <div class="footer-grid">
      <!-- Left: Terms & Remittance -->
      <div>
        <div class="bottom-box-title">Terms &amp; Conditions</div>
        <ol id="terms"></ol>
        <div class="remit">
          <strong style="color: var(--navy);">Remittance:</strong>
          <span id="bankSummary"></span>
        </div>
      </div>

      <!-- Right: Signatures & Signing Date -->
      <div id="sigWrap">
        <div class="cert" id="cert"></div>
        <div class="sigs">
          <div class="sig">
            <div class="ln" id="sigLine"></div>
            <div class="cap" id="sigCap"></div>
          </div>
          <div class="sig">
            <div class="ln" id="sigDate"></div>
            <div class="cap">Date</div>
          </div>
        </div>
      </div>
    </div>
  </footer>
</div>

<script>
function renderInvoice(rawPayload) {
  const D = rawPayload || {};
  Object.assign(D, {
    seller: D.seller || {},
    bill_to: D.bill_to || {},
    ship_to: D.ship_to || {},
    shipping: D.shipping || {},
    tax: Object.assign({ rate: 0 }, D.tax),
    signature: D.signature || {},
    items: D.items || [],
    terms: D.terms || {}
  });

  const $ = id => document.getElementById(id);
  const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; };
  const row = (cells, cls) => { const tr = el('tr'); if (cls) tr.className = cls; cells.forEach(c => tr.appendChild(c)); return tr; };

  // Formatting helpers
  const fmtDate = s => {
    if (!s) return '—';
    const parts = s.split('-');
    if (parts.length < 3) return s;
    return `${parts[1]}/${parts[2]}/${parts[0]}`;
  };
  const money = c => ((c || 0) / 100).toLocaleString('en-US', { minFractionDigits: 2, minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });

  const ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function words(n) {
    if (n === 0) return 'Zero';
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
    if (n < 1000) return ONES[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + words(n % 100) : '');
    const scales = [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']];
    for (const [v, name] of scales) if (n >= v) return words(Math.floor(n / v)) + ' ' + name + (n % v ? ' ' + words(n % v) : '');
    return '';
  }
  const amountWords = c => {
    const d = Math.floor((c || 0) / 100), ct = (c || 0) % 100;
    return `${words(d)} Dollar${d === 1 ? '' : 's'}${ct ? ` and ${words(ct)} Cent${ct === 1 ? '' : 's'}` : ' and No Cents'} Only`;
  };

  // Calculations
  const isPF = D.document_type === 'pro_forma';
  const items = (D.items || []).map(i => ({ ...i, amount: Math.round((i.qty || 0) * (i.unit_price_cents || 0)) }));
  const subtotal = items.reduce((s, i) => s + i.amount, 0);
  const taxableLines = items.filter(i => i.taxable).reduce((s, i) => s + i.amount, 0);
  const ship = D.shipping.charge_cents || 0, disc = D.discount_cents || 0;
  const exempt = !!D.tax.exempt_cert;
  let base = taxableLines + (D.tax.shipping_taxable ? ship : 0) - (D.tax.discount_reduces_base ? Math.min(disc, taxableLines) : 0);
  base = Math.max(base, 0);
  const tax = exempt ? 0 : Math.round(base * (D.tax.rate || 0));
  const total = subtotal + ship - disc + tax;

  // Header & Title
  const S = D.seller;
  const coAddrEl = $('coAddr');
  coAddrEl.replaceChildren();
  coAddrEl.append(...[...(S.lines || []),
    [S.phone && 'Phone: ' + S.phone, S.fax && 'Fax: ' + S.fax].filter(Boolean).join('  |  '),
    [S.web, S.email, S.tax_id && 'Tax ID: ' + S.tax_id].filter(Boolean).join('  |  ')]
    .filter(Boolean).flatMap(t => [document.createTextNode(t), el('br')]));
  
  const nameEl = document.querySelector('[data-b="seller.name"]');
  if (nameEl) nameEl.textContent = S.name || '';
  $('title').textContent = isPF ? 'Pro Forma Invoice' : 'Invoice';
  $('docNo').textContent = '# ' + (D.invoice_no || '');

  // Header prominent dates
  $('issueDateVal').textContent = fmtDate(D.issue_date);
  $('termDateLbl').textContent = isPF ? 'Valid Until:' : 'Due Date:';
  $('termDateVal').textContent = fmtDate(isPF ? D.valid_until : D.due_date);

  // Synchronize document title for browser print save-as filename
  const cleanDocName = `${D.invoice_no || 'Document'}_${((D.bill_to && (D.bill_to.company || D.bill_to.name)) || 'Invoice').replace(/[^a-zA-Z0-9_-]/g, '_')}`;
  document.title = cleanDocName;

  // Parties & Order Particulars
  function party(target, p) {
    target.replaceChildren();
    if (p.name) target.appendChild(el('div', p.name, 'nm'));
    [p.company, ...(p.lines || [])].filter(Boolean).forEach(t => target.appendChild(el('div', t)));
    [p.phone && 'Phone: ' + p.phone, p.email, p.contact && 'Site contact: ' + p.contact].filter(Boolean)
      .forEach(t => target.appendChild(el('div', t)));
  }
  party($('billTo'), D.bill_to);
  party($('shipTo'), D.ship_to);

  const orderKvEl = $('orderKv');
  orderKvEl.replaceChildren();
  [
    ['Customer ID', D.customer_id || 'CUST-101'],
    ['Payment Terms', D.payment_terms || 'Net 30 Days'],
    ['Project', D.project || 'General Jobsite'],
    ['Delivery Terms', D.shipping.terms || 'FOB Jobsite'],
    ['Freight Type', D.shipping.freight_type || 'Standard Freight']
  ].forEach(([k, v]) => orderKvEl.appendChild(row([el('td', k), el('td', v)])));

  // Line items
  const rowsEl = $('rows');
  rowsEl.replaceChildren();
  items.forEach((i, n) => {
    const descCell = el('td');
    descCell.append(el('div', i.name, 'item-title'));
    // Merge SKU and spec into a compact secondary line
    const secondaryParts = [i.sku, i.spec && i.spec.trim()].filter(Boolean);
    if (secondaryParts.length) {
      descCell.append(el('div', secondaryParts.join(' · '), 'sp'));
    }
    rowsEl.appendChild(row([
      el('td', n + 1, 'c'),
      descCell,
      el('td', i.uom || 'ea', 'c'),
      el('td', num(i.qty), 'r'),
      el('td', money(i.unit_price_cents), 'r'),
      el('td', money(i.amount), 'r')
    ]));
  });
  $('words').textContent = amountWords(total);

  // Totals table (Subtotal, Taxable, Tax, Total Due)
  const totalsEl = $('totals');
  totalsEl.replaceChildren();
  const T = [['Subtotal', money(subtotal)]];
  if (ship) T.push(['Shipping & Handling', money(ship)]);
  if (disc) T.push(['Discount', '−' + money(disc)]);
  T.push(['Taxable Amount', exempt ? '0.00' : money(base)],
         [exempt ? `Tax (exempt: ${D.tax.exempt_cert})` : `Tax (${((D.tax.rate || 0) * 100).toFixed(3)}%)`, money(tax)]);
  T.forEach(([k, v]) => totalsEl.appendChild(row([el('td', k), el('td', v)])));
  totalsEl.appendChild(row([el('td', isPF ? 'Total Estimated' : 'Total Due'), el('td', '$ ' + money(total))], 'grand'));
  totalsEl.appendChild(row([el('td', 'Currency'), el('td', D.currency || 'USD')], 'sm'));

  // Terms & Remittance in bottom pinned block
  const fill = t => t.replace('{payment_terms}', D.payment_terms || 'Net 30 Days');
  const termsEl = $('terms');
  termsEl.replaceChildren();
  (D.terms[isPF ? 'pro_forma' : 'invoice'] || []).forEach(t => termsEl.appendChild(el('li', fill(t))));

  const bankEl = $('bankSummary');
  const B = D.bank || {};
  bankEl.textContent = `Remit via ACH/Wire to ${B.beneficiary || S.name || 'Contractor'} • ${B.name || 'Commercial Depository Bank'} (Acct: •••• ${B.account_last4 || '9901'})`;

  // Notes & Signatures in bottom pinned block
  const notesEl = $('notes');
  if (D.notes) {
    notesEl.hidden = false;
    notesEl.textContent = D.notes;
  } else {
    notesEl.hidden = true;
  }

  const sigWrapEl = $('sigWrap');
  if (D.signature && D.signature.show) {
    sigWrapEl.hidden = false;
    $('cert').textContent = D.certification || 'I certify that the information in this document is true and correct.';
    
    // Left: Signature Line
    const sigLine = $('sigLine');
    sigLine.replaceChildren();
    if (D.signature.image) {
      const im = el('img');
      im.src = D.signature.image;
      im.alt = 'Signature';
      sigLine.appendChild(im);
    } else {
      const signatoryName = D.signature.name || 'Authorized Signatory';
      const handText = el('span', signatoryName);
      handText.style.cssText = 'font-family:"Segoe Script","Brush Script MT",cursive;font-size:11pt;color:#0f2744;letter-spacing:0.3px;';
      sigLine.appendChild(handText);
    }
    
    const cap = $('sigCap');
    cap.replaceChildren();
    cap.append(
      el('b', D.signature.name || 'Representative'),
      document.createTextNode(D.signature.title ? ` · ${D.signature.title}` : ''),
      el('br'),
      el('span', S.name || '')
    );
    // Style the company line smaller
    const companyLine = cap.querySelector('span');
    if (companyLine) companyLine.style.cssText = 'font-size:6.5pt;color:#9ca3af;';

    // Right: Date Line (Explicitly print the issue date!)
    const sigDateEl = $('sigDate');
    sigDateEl.replaceChildren();
    sigDateEl.textContent = fmtDate(D.issue_date);
  } else {
    sigWrapEl.hidden = true;
  }
}

// Initial hydration from inline script or window
(function () {
  const initialPayload = window.INVOICE_DATA || JSON.parse(document.getElementById('invoice-data').textContent);
  renderInvoice(initialPayload);

  // Listen for live updates from BuildBill app
  window.addEventListener('message', function (event) {
    if (event.data && event.data.type === 'SYNC_INVOICE_DATA' && event.data.payload) {
      renderInvoice(event.data.payload);
    } else if (event.data && event.data.type === 'TRIGGER_PRINT') {
      window.print();
    }
  });
})();
</script>
</body>
</html>
